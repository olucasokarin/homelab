<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleBot Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon_geral.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --secondary: #ec4899;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
      width: 100%;
      max-width: 800px;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateX(-5px);
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(to right, #fff, var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 1.5rem;
      border-radius: 1.25rem;
      text-align: center;
    }

    .stat-card h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--primary);
    }

    .active-downloads {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .download-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .download-item {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 1.25rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.4s ease-out;
      position: relative;
      overflow: hidden;
    }

    .download-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      transition: width 0.5s ease-in-out;
    }

    .video-info h3 {
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    .video-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      font-weight: 600;
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      border: 1px dashed var(--glass-border);
      border-radius: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .stats-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="nav-header">
        <a href="/" class="back-btn">← Home Dashboard</a>
        <div id="status-dot-global" class="status-indicator status-checking" style="position: relative; top: 0; right: 0;">
          <span class="status-dot"></span>
          <span id="bot-status-text">Conectando...</span>
        </div>
      </div>
      <h1>TeleBot Downloader</h1>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Gerenciamento de Fila de Séries & Vídeos</p>
    </header>

    <div class="stats-summary">
      <div class="stat-card">
        <h4>Ativos</h4>
        <div id="stat-active" class="value">0</div>
      </div>
      <div class="stat-card">
        <h4>Falhas</h4>
        <div id="stat-failed" class="value">0</div>
      </div>
      <div class="stat-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;">
        <button onclick="retryAll()" id="retry-btn" style="background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%;">
          🔄 Retentar Todos
        </button>
        <div id="stat-queue" style="font-size: 0.7rem; color: var(--text-muted);">0 na fila local</div>
      </div>
    </div>

    <div class="active-downloads">
      <div class="section-title">Downloads em Andamento</div>
      <div id="active-list" class="download-list">
        <div class="empty-state">Buscando status dos downloads...</div>
      </div>
    </div>

    <div class="queued-downloads" style="margin-bottom: 2rem;">
      <div class="section-title">Fila de Espera</div>
      <div id="queue-list" class="download-list">
        <!-- JS Populated -->
      </div>
    </div>

    <div class="failed-downloads">
      <div class="section-title">Falhas na Sessão</div>
      <div id="failed-list" class="download-list">
        <!-- JS Populated -->
      </div>
    </div>
  </div>

  <script>
    const BOT_API = `http://192.168.1.110:5001/api/telebot/status`;

    async function updateStatus() {
      try {
        const response = await fetch(BOT_API);
        if (!response.ok) throw new Error("API Offline");
        const data = await response.json();

        // Update Stats
        document.getElementById('stat-active').innerText = data.active.length;
        document.getElementById('stat-failed').innerText = data.failed.length;
        document.getElementById('stat-queue').innerText = (data.queue ? data.queue.length : 0) + " na fila local";

        // Update Active List
        const activeList = document.getElementById('active-list');
        if (data.active && data.active.length > 0) {
          activeList.innerHTML = data.active.map(job => `
            <div class="download-item">
              <div class="download-item-header">
                <div class="video-info">
                  <h3>${job.file_name}</h3>
                  <p>ID: ${job.file_id.substring(0, 15)}... • ${(job.file_size / (1024 * 1024)).toFixed(1)} MB</p>
                </div>
                <div class="status-badge">${job.progress}%</div>
              </div>
              <div class="progress-container">
                <div class="progress-fill" style="width: ${job.progress}%"></div>
              </div>
            </div>
          `).join('');
        } else {
          activeList.innerHTML = '<div class="empty-state">Nenhum download ativo no momento.</div>';
        }

        // Update Queue List
        const queueList = document.getElementById('queue-list');
        if (data.queue && data.queue.length > 0) {
          queueList.innerHTML = data.queue.map(job => `
            <div class="download-item" style="opacity: 0.7;">
              <div class="download-item-header">
                <div class="video-info">
                  <h3>${job.file_name}</h3>
                  <p>Aguardando slot disponível...</p>
                </div>
                <div class="status-badge" style="background: rgba(255,255,255,0.1); color: #fff;">NA FILA</div>
              </div>
            </div>
          `).join('');
        } else {
          queueList.innerHTML = '';
        }

        // Update Failed List
        const failedList = document.getElementById('failed-list');
        if (data.failed.length > 0) {
          failedList.innerHTML = data.failed.map(job => `
            <div class="download-item" style="border-color: rgba(239, 68, 68, 0.3);">
              <div class="video-info">
                <h3>${job.file_name}</h3>
                <p style="color: #ef4444;">Interrompido</p>
              </div>
              <div class="status-badge" style="background: rgba(239, 68, 68, 0.2); color: #ef4444;">ERRO</div>
            </div>
          `).join('');
        } else {
          failedList.innerHTML = '';
        }

        document.getElementById('bot-status-text').innerText = "Bot Online";
      } catch (e) {
        console.error("API Error", e);
        document.getElementById('bot-status-text').innerText = "Bot Offline";
      }
    }

    async function retryAll() {
      const btn = document.getElementById('retry-btn');
      const originalText = btn.innerHTML;
      btn.innerText = "⏳ Retentando...";
      btn.disabled = true;

      try {
        const response = await fetch(`http://192.168.1.110:5001/api/telebot/retry`, {
          method: 'POST'
        });
        if (response.ok) {
          const result = await response.json();
          btn.innerText = `✅ Recomeçou ${result.count}!`;
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
            updateStatus();
          }, 2000);
        } else {
          throw new Error("Falha no servidor");
        }
      } catch (e) {
        alert("Erro ao tentar reiniciar downloads: " + e.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    // Loop
    updateStatus();
    setInterval(updateStatus, 5000);
  </script>
</body>

</html>
